name: Build

# Builds and tests the Java 6/7 agent. It builds with a plain javac on JDK 8, the last javac
# that accepts -source 1.6. The agent jar is produced at build/opentelemetry-java6-agent.jar
# and uploaded as a workflow artifact. On v* tag pushes (after a green build) it also
# publishes the jar as a GitHub release.

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 8 is required: it is the last javac that accepts -source 1.6 -target 1.6
      - name: Set up JDK 8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 8

      # compiles with -source 1.6 -target 1.6, shades the dependencies, and verifies that no
      # class file in the resulting jar is newer than Java 6 (major version 50)
      - name: Build agent
        run: ./build.sh

      # unit tests ported from the main project (JDBC URL parser, SQL sanitizer, URL sanitizers,
      # Forwarded headers) run by MiniJupiter, plus a smoke test against the logging exporter
      - name: Unit and smoke tests
        run: ./run-test.sh

      # animal-sniffer: no JDK API newer than Java 6 is referenced
      - name: Java 6 API check
        run: ./check-java6-api.sh

      # the agent's OTLP traces and metrics diffed against the standard agent's (span trees,
      # typed attributes, metric definitions) for an embedded Jetty 8 + dbcp + H2 application
      - name: Parity test
        run: ./run-parity-test.sh

      # TLS 1.3/1.2 export through Bouncy Castle against local receivers: trusted CA, untrusted CA
      # and host name mismatch
      - name: TLS test
        run: ./run-tls-test.sh

      - name: Upload agent jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentelemetry-java6-agent.jar
          path: build/opentelemetry-java6-agent.jar

  release:
    # publishes the built jar as a GitHub release, only on v* tag pushes and only after a
    # green build; replaces any existing release for the tag so re-pushing a tag is safe
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 8

      - name: Build agent
        run: ./build.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # idempotent: replace any existing release for this tag (keeps the tag itself)
          gh release delete "${GITHUB_REF_NAME}" --yes >/dev/null 2>&1 || true
          gh release create "${GITHUB_REF_NAME}" \
            build/opentelemetry-java6-agent.jar \
            --title "${GITHUB_REF_NAME}" \
            --notes "OpenTelemetry Java agent for Java 6 and Java 7. See the README for usage, configuration, and supported instrumentations." \
            --latest
